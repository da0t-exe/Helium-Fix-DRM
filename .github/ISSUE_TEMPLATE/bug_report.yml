name: Installer bug
description: Report an installation, update, or diagnostic problem.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: "Please share sanitized output only. Do not upload raw HAR files, cookies, tokens, or license payloads. Netflix compatibility is not guaranteed."
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Windows, PowerShell, Helium, Chrome, and Widevine versions; user or system installation.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Include the command and what you expected to happen.
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Actual result and sanitized output
      description: Distinguish an installer error from a streaming service refusing playback.
      render: text
    validations:
      required: true
  - type: textarea
    id: checks
    attributes:
      label: Checks already performed
      description: For example, diagnostic output, closing Helium, updating Chrome, or trying a matching source.
