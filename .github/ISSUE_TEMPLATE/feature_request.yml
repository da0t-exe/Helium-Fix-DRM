name: Feature request
description: Suggest an improvement to the installer or documentation.
title: "[Feature]: "
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: Describe the task that is difficult today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed improvement
      description: Explain the expected behavior and any alternatives you considered.
    validations:
      required: true
